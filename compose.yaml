services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: yanemedia
      POSTGRES_USER: yanemedia
      POSTGRES_PASSWORD: yanemedia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yanemedia -d yanemedia"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://yanemedia:yanemedia@postgres:5432/yanemedia
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
